<div id="app">
  <main id="stage" aria-label="3D model of the brew nook">
    <div id="gl"></div>
    <div id="labels"></div>
    <header class="hud">
      <div class="hud-title">
        <h1>Brew nook <span>roller shutter</span></h1>
        <p>Drag to orbit, scroll or pinch to zoom toward the pointer, right-drag to pan. Double-click anything to zoom in on it.</p>
      </div>
      <div class="chips" id="chips"></div>
      <div class="legend" id="mountLegend" hidden>
        <span><i class="sw struct"></i>Posts, jambs and brackets</span>
        <span><i class="sw fix"></i>Bolts, screws and anchors</span>
        <span><i class="sw shut"></i>Shutter (guides, headbox, curtain)</span>
      </div>
    </header>
    <div class="dock">
      <nav class="views" id="views" aria-label="Camera views"></nav>
      <div class="views" id="modes" role="group" aria-label="Display mode"></div>
      <div class="runbar" id="runbar">
        <button type="button" class="primary" id="runBtn">Close</button>
        <label for="openRange" class="sr">Open</label>
        <input type="range" id="openRange" min="0" max="100" step="1">
        <output id="openOut" for="openRange"></output>
      </div>
    </div>
    <div id="tip" class="tip" hidden></div>
  </main>
  <aside id="panel" aria-label="Controls">
    <div class="panel-head">
      <div>
        <h2>Plan the shutter</h2>
        <small>All sizes in millimetres</small>
      </div>
      <button type="button" class="btn" id="panelToggle" aria-expanded="false">Controls</button>
    </div>
    <div id="sections"></div>
  </aside>
</div>
