<html><head><meta charset="utf-8"><title>vessel harness</title>

</head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { makeCtx } from './ctx.js';
const id = new URLSearchParams(location.search).get('v');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();

sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -1.5, right: 1.5, top: 1.5, bottom: -1.5 }); sun.shadow.bias = -0.0004;

const grid = new THREE.GridHelper(2, 20, 0x888888, 0xaaaaaa); grid.position.y = 0.001; scene.add(grid); // 100 mm squares
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.01, 50);

const obj = mod.build(THREE, ctx, mod.defaultOptions || {});

obj.traverse((o) => { if (o.isMesh) { meshes++; const g = o.geometry; const n = g.index ? g.index.count / 3 : g.attributes.position.count / 3; tris += o.isInstancedMesh ? n * o.count : n; } });
const size = bb.getSize(new THREE.Vector3()), c = bb.getCenter(new THREE.Vector3());
const r = Math.max(size.x, size.y, size.z);
window.stats = { meta: mod.meta, bbox: { min: bb.min.toArray().map((v) => +v.toFixed(4)), max: bb.max.toArray().map((v) => +v.toFixed(4)), size: size.toArray().map((v) => Math.round(v * 1000)) }, core: core.isEmpty() ? null : { size: core.getSize(new THREE.Vector3()).toArray().map((v) => Math.round(v * 1000)) }, tris: Math.round(tris), meshes };
const views = {
  front: [c.x, c.y, c.z + r * 2.6], threeq: [c.x + r * 1.7, c.y + r * 0.9, c.z + r * 1.9], back: [c.x - r * 1.6, c.y + r * 0.5, c.z - r * 2.0],
  top: [c.x, c.y + r * 2.8, c.z + 0.01], low: [c.x + r * 0.9, r * 0.15, c.z + r * 1.6], side: [c.x + r * 2.6, c.y, c.z],
};

  const p = views[name] || name; const t = target ? new THREE.Vector3(...target) : c;
  camera.position.set(t.x + (p[0] - c.x) / zoom, t.y + (p[1] - c.y) / zoom, t.z + (p[2] - c.z) / zoom); camera.lookAt(t);
  renderer.render(scene, camera);

</script></body></html>
